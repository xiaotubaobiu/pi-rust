[package]
name = "pi-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pirs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eventsource-stream = "0.2.3"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rustyline = "18.0.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
