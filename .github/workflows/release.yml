name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pirs
            asset: pirs-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: pirs
            asset: pirs-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: pirs
            asset: pirs-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pirs.exe
            asset: pirs-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - name: Free disk space (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /
      - run: cargo build --release --target ${{ matrix.target }} --bin pirs
      # rename to the release asset name: the built file is `pirs` on every
      # unix target, and merge-multiple download would otherwise collapse
      # same-named files from different platform artifacts into one
      - name: Stage artifact under its asset name
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "stage/${{ matrix.asset }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: stage/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Attach binaries to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/pirs-linux-x64 dist/pirs-macos-arm64 dist/pirs-macos-x64
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
